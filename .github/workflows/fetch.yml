name: Iran Tracker — Auto Fetch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic

      - name: Run fetcher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_updates.py

      - name: Commit updated data
        run: |
          git config user.name  "iran-tracker-bot"
          git config user.email "bot@iran-tracker"
          git add entries.json seen_ids.json
          git diff --staged --quiet || git commit -m "auto: update entries $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
